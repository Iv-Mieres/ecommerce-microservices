spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/customer_db

management:
  endpoints:
    web:
      exposure:
        include: refresh

logging:
  level:
    root: INFO
    com.ivanm.microservices: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/customer-service.log
    max-size: 10MB
    max-history: 30

server:
  port: 8091
customer:
  data: '8092'